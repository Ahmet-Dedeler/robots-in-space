[project]
name = "venus-lab-tools"
version = "0.1.0"
description = "Offline data baking for Venus Lab: CO2 property tables, robot assets, policy weights."
requires-python = ">=3.12"
dependencies = [
  "CoolProp>=6.6",
  "numpy>=2.0",
  "trimesh>=4.0",
  "fast-simplification>=0.1",
  "mujoco>=3.3",
  "torch>=2.4",
  "pyyaml>=6.0",
  "scipy>=1.18.1",
  "shapely>=2.1.2",
  "manifold3d>=3.5.4",
  "mapbox-earcut>=2.1.0",
  "rtree>=1.4.1",
  "networkx>=3.7",
]
